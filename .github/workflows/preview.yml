name: PR Preview & Smoke (Cloudflare Workers)

# Builds the site and uploads a *preview* version of the Worker for every pull
# request, then posts the unique preview URL as a new PR comment on each push
# (so every revision keeps its own preview link in the timeline). A Playwright
# smoke suite then runs against that URL — the real artifact, served by
# Cloudflare with the real _headers — before the PR can be merged.
#
# This uses `wrangler versions upload` (not `deploy`), so production traffic on
# `mainline` is never affected — each upload gets its own immutable preview URL.
#
# The workflow's own name is cosmetic: a branch ruleset's required check is the
# *job* name (`Smoke tests`), so renaming this line does not disturb it.
#
# One-time setup required:
#   - Repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must exist
#     (already used by deploy.yml).
#   - The API token needs the "Workers Scripts: Edit" permission.
#   - Preview URLs must be enabled for the Worker:
#       Cloudflare dashboard ▸ Workers & Pages ▸ builtbywoodley ▸ Settings ▸
#       Domains & Routes ▸ enable "Preview URLs".

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Serialize runs per PR (don't cancel in-progress ones) so every push gets its
# own run that finishes and posts its own preview comment, even if pushes land
# in quick succession.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# No token permissions by default; the job opts into exactly what it needs.
permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Handed to the smoke job below so it can test the artifact that was just
    # uploaded rather than a build of its own.
    outputs:
      url: ${{ steps.preview.outputs.url }}
    permissions:
      contents: read
      # Needed to post the preview URL comment on the PR.
      pull-requests: write
    # Pull requests from forks cannot read repository secrets, so the upload
    # would fail with a confusing error. Skip them rather than fail noisily.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `npm ci` below runs dependency lifecycle scripts, so don't leave the
          # job's GITHUB_TOKEN in .git/config for them to read. Cloudflare auth is
          # passed explicitly to wrangler-action, and github-script authenticates
          # with the workflow token from the environment, not from the git remote.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # `npm ci` runs the repo's `prepare` script, which downloads a gitleaks
          # binary for the local pre-commit hook. This job never runs that hook,
          # so skip the download rather than fetch a binary to leave unused.
          SKIP_GITLEAKS_INSTALL: "1"

      - name: Build site
        run: npm run build

      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Match deploy.yml: pin wrangler 4.x so it can't drift to 3.x.
          wranglerVersion: "4"
          command: >-
            versions upload
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"

      - name: Resolve preview URL
        id: preview
        env:
          # Bind action outputs to env vars to avoid shell injection from
          # interpolating ${{ ... }} directly into the script body.
          DEPLOY_URL: ${{ steps.upload.outputs.deployment-url }}
          CMD_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          set -euo pipefail
          # `versions upload` does not reliably populate the action's
          # deployment-url output, so parsing the "Version Preview URL" out of
          # wrangler's stdout is the primary mechanism here; DEPLOY_URL is just
          # a best-effort shortcut if a future action version starts setting it.
          url="${DEPLOY_URL:-}"
          if [ -z "$url" ]; then
            url="$(printf '%s' "$CMD_OUTPUT" \
              | grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' \
              | head -n1 || true)"
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not determine the preview URL from wrangler output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const { PREVIEW_URL, COMMIT_SHA } = process.env;
            const shortSha = COMMIT_SHA.slice(0, 7);
            const body = [
              marker,
              '### ⚡ Cloudflare preview deployed',
              '',
              `| | |`,
              `| --- | --- |`,
              `| **Preview URL** | ${PREVIEW_URL} |`,
              `| **Commit** | \`${shortSha}\` |`,
              '',
              '_Posted automatically for this commit. A new comment is added on every push._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Post a fresh comment for every push so each revision keeps its own
            // preview URL in the PR timeline (rather than overwriting one comment).
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });

  smoke:
    name: Smoke tests
    needs: preview
    # `always()` so this still runs when `preview` was skipped, which is every
    # fork PR — those cannot read the Cloudflare secrets. SMOKE_BASE_URL is
    # empty in that case and playwright.config.ts falls back to building and
    # serving the site itself, so this check reports on every pull request and
    # is therefore safe to make a required one.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Playwright talks to the preview URL over the public internet and to
      # nothing else; reading the source is the whole requirement.
      contents: read
    env:
      SMOKE_BASE_URL: ${{ needs.preview.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `npm ci` below runs dependency lifecycle scripts. Nothing in this
          # job talks to the GitHub API, so the token has no business staying
          # in .git/config where they could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Same reasoning as the preview job: this one never runs the
          # pre-commit hook, so don't fetch a gitleaks binary to leave unused.
          SKIP_GITLEAKS_INSTALL: "1"

      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The browser build a given @playwright/test pins is fixed by the
          # lockfile, so that is the honest cache key.
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # Near-instant on a cache hit; --with-deps still runs because the apt
        # system libraries the browsers need are not part of the cached path.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
