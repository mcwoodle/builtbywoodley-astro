name: PR Preview (Cloudflare Workers)

# Builds the site and uploads a *preview* version of the Worker for every pull
# request, then posts the unique preview URL as a new PR comment on each push
# (so every revision keeps its own preview link in the timeline).
#
# This uses `wrangler versions upload` (not `deploy`), so production traffic on
# `mainline` is never affected — each upload gets its own immutable preview URL.
#
# One-time setup required:
#   - Repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must exist
#     (already used by deploy.yml).
#   - The API token needs the "Workers Scripts: Edit" permission.
#   - Preview URLs must be enabled for the Worker:
#       Cloudflare dashboard ▸ Workers & Pages ▸ builtbywoodley ▸ Settings ▸
#       Domains & Routes ▸ enable "Preview URLs".

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Serialize runs per PR (don't cancel in-progress ones) so every push gets its
# own run that finishes and posts its own preview comment, even if pushes land
# in quick succession.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pull requests from forks cannot read repository secrets, so the upload
    # would fail with a confusing error. Skip them rather than fail noisily.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Match deploy.yml: pin wrangler 4.x so it can't drift to 3.x.
          wranglerVersion: "4"
          command: >-
            versions upload
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"

      - name: Resolve preview URL
        id: preview
        env:
          # Bind action outputs to env vars to avoid shell injection from
          # interpolating ${{ ... }} directly into the script body.
          DEPLOY_URL: ${{ steps.upload.outputs.deployment-url }}
          CMD_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          set -euo pipefail
          # `versions upload` does not reliably populate the action's
          # deployment-url output, so parsing the "Version Preview URL" out of
          # wrangler's stdout is the primary mechanism here; DEPLOY_URL is just
          # a best-effort shortcut if a future action version starts setting it.
          url="${DEPLOY_URL:-}"
          if [ -z "$url" ]; then
            url="$(printf '%s' "$CMD_OUTPUT" \
              | grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' \
              | head -n1 || true)"
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not determine the preview URL from wrangler output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const { PREVIEW_URL, COMMIT_SHA } = process.env;
            const shortSha = COMMIT_SHA.slice(0, 7);
            const body = [
              marker,
              '### ⚡ Cloudflare preview deployed',
              '',
              `| | |`,
              `| --- | --- |`,
              `| **Preview URL** | ${PREVIEW_URL} |`,
              `| **Commit** | \`${shortSha}\` |`,
              '',
              '_Posted automatically for this commit. A new comment is added on every push._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Post a fresh comment for every push so each revision keeps its own
            // preview URL in the PR timeline (rather than overwriting one comment).
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });
