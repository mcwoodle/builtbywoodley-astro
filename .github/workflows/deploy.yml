name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - mainline

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action@v3 bundles wrangler 3.x, which requires a `main`
          # entry-point and cannot deploy an assets-only Worker. Pin v4, which
          # supports static-assets Workers (matches local `wrangler` 4.x).
          wranglerVersion: "4"
          command: deploy
