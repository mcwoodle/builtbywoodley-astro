name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - mainline

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action@v4 bundles wrangler 4.x, which supports
          # assets-only Workers (matches local `wrangler` 4.x). Keep the
          # explicit pin so the deployed wrangler can't drift back to 3.x.
          wranglerVersion: "4"
          command: deploy
