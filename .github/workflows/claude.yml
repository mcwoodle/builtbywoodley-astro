name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # `assigned` is deliberately absent: on that event github.actor is the
  # assigner, not the issue author, so the owner gate below would let a
  # stranger's issue body become the prompt. On `opened` the actor is the
  # author, so the gate holds.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

# No token permissions by default; the job opts into exactly what it needs.
permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  claude:
    # Only the repository owner can invoke Claude. On a public repo this prevents
    # strangers from triggering runs on the owner's CLAUDE_CODE_OAUTH_TOKEN by
    # commenting "@claude". To let collaborators in too, swap github.actor for an
    # author_association check (OWNER/MEMBER/COLLABORATOR).
    #
    #
    # The second clause closes what the actor check alone does not: it says who
    # INVOKE Claude, not whose text it then reads. Requiring the thread to be
    # the owner's own as well means a stranger's issue body or PR description
    # can never become the prompt, even when the owner is the one asking. The
    # cost is that "@claude" on a contributor's PR no longer runs — relax this
    # clause only if you are content to treat its output there as untrusted.
    # `contents: read` is what bounds the damage either way: the run cannot
    # push, open a PR, or alter the repo.
    if: |
      github.actor == github.repository_owner &&
      (github.event.issue.user.login == github.repository_owner ||
       github.event.pull_request.user.login == github.repository_owner) && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # The action authenticates with the token from the environment, and
          # `contents: read` means it cannot push regardless, so the credential
          # does not need to persist in .git/config.
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

