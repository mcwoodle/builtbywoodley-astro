name: Security

# Secret + dependency scanning. Runs on PRs and pushes to mainline, plus a
# weekly schedule so fresh advisories and a full-history secret rescan happen
# even when the repo is quiet.
on:
  pull_request:
  push:
    branches:
      - mainline
  schedule:
    # Mondays 07:13 UTC (off the hour to avoid scheduler congestion).
    - cron: "13 7 * * 1"

# Least privilege by default; jobs opt into more where needed.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists PR commits via the API on pull_request events.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so scheduled/push runs scan every commit, not just the
          # latest diff. gitleaks-action scopes PR runs to the PR commits.
          fetch-depth: 0
      - name: Run gitleaks
        # Pinned to a commit SHA (Dependabot's github-actions ecosystem keeps
        # this current). Fails the job on any finding.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          # Free for personal/public repos — no license key required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Audit the resolved lockfile for known high/critical advisories. npm audit
      # works on private repos (unlike dependency-review-action, which requires
      # GitHub Advanced Security), so the same gate runs on PRs, pushes, and the
      # weekly schedule.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: npm audit (high+)
        run: npm audit --audit-level=high
