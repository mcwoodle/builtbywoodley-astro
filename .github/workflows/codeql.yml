name: CodeQL

# Static analysis (SAST) for JavaScript/TypeScript. Results surface under
# Security ▸ Code scanning; the repo's code-scanning "check failure" severity
# setting (configured by the owner) decides which findings block PRs.
on:
  pull_request:
  push:
    branches:
      - mainline
  schedule:
    - cron: "27 7 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # Code scanning needs GitHub Advanced Security, which is free only on public
    # repos. Skip while the repo is private; the job runs automatically once it
    # goes public. Remove this guard if GHAS is enabled on a private plan.
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      # Required to upload analysis results to the code-scanning API.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
