version: 2
updates:
  # Keep npm dependencies current. Version-update PRs run on this private repo;
  # enable Dependabot alerts + security updates in repo settings for
  # advisory-driven PRs (both are free on private repos).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  # Keep pinned GitHub Actions (incl. the SHA-pinned third-party actions in
  # the security workflow) up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
