version: 2
updates:
  # Keep npm dependencies current. These are the scheduled version-update PRs;
  # the advisory-driven ones come from Dependabot security updates, which is
  # enabled under the repository's Security settings rather than configured here.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  # Keep pinned GitHub Actions (incl. the SHA-pinned third-party actions in
  # the security workflow) up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
